<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="village">

        
        <div class="sun"></div>

       
        <div class="cloud cloud1">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="cloud cloud2">
            <span></span>
            <span></span>
            <span></span>
        </div>

       
        <div class="mountain mountain1"></div>
        <div class="mountain mountain2"></div>

        <!-- HOUSE -->
        <div class="house">
            <div class="roof"></div>

            <div class="house-body">
                <div class="window"></div>
                <div class="door"></div>
            </div>
        </div>

        <!-- TREE -->
        <div class="tree tree1">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>

        <div class="tree tree2">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>

       
        <div class="road">
            <div class="road-line line1"></div>
            <div class="road-line line2"></div>
            <div class="road-line line3"></div>
            <div class="road-line line4"></div>
        </div>

       
        <div class="person">

            <div class="head"></div>

            <div class="body"></div>

            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>

            <div class="leg left-leg"></div>
            <div class="leg right-leg"></div>

        </div>

      
        <div class="car">

            <div class="car-top"></div>

            <div class="car-body"></div>

            <div class="wheel wheel1"></div>
            <div class="wheel wheel2"></div>

        </div>

    </div>

</body>
</html>
